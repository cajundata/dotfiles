# ~/dotfiles/starship/starship.toml
# Cajun Data palette (cajundata.com brand tokens); solarized_dark kept for switching

palette = "cajun_data"

[palettes.cajun_data]
base03  = "#0b0c0e"
base02  = "#141619"
base01  = "#5b656c"
base00  = "#7f8a91"
base0   = "#9aa4ab"
base1   = "#c9d3d8"
base2   = "#eef1f3"
base3   = "#ffffff"
yellow  = "#fbbf24"
orange  = "#fb923c"
red     = "#f87171"
magenta = "#f472b6"
violet  = "#a78bfa"
blue    = "#38bdf8"
cyan    = "#22d3ee"
green   = "#34d399"

[palettes.solarized_dark]
base03  = "#002b36"
base02  = "#073642"
base01  = "#586e75"
base00  = "#657b83"
base0   = "#839496"
base1   = "#93a1a1"
base2   = "#eee8d5"
base3   = "#fdf6e3"
yellow  = "#b58900"
orange  = "#cb4b16"
red     = "#dc322f"
magenta = "#d33682"
violet  = "#6c71c4"
blue    = "#268bd2"
cyan    = "#2aa198"
green   = "#859900"

format = """
$username\
$directory\
$git_branch\
$git_status\
$python\
$golang\
$nodejs\
$cmd_duration\
$line_break\
$character"""

[username]
style_user = "base01"
format = "[$user]($style_user) "
show_always = false

[directory]
style = "blue bold"
format = "[$path]($style)[$read_only](red) "
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "green"
format = "[$symbol$branch]($style) "

[git_status]
style = "yellow"
format = "([$all_status$ahead_behind]($style) )"

[python]
symbol = " "
style = "yellow"
format = "[$symbol$version( \\($virtualenv\\))]($style) "

[golang]
symbol = " "
style = "cyan"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
style = "green"
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 2000
style = "base01"
format = "[$duration]($style) "

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"